<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a472a" />
    <meta name="description" content="Football Game - Play with country flags!" />
    <title>Football Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      #gameContainer {
        text-align: center;
      }

      #gameCanvas {
        border: 4px solid #fff;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        background: #2d8b3d;
        cursor: default;
      }

      #scoreBoard {
        margin-top: 20px;
        background: rgba(255, 255, 255, 0.95);
        padding: 15px 30px;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }

      .score {
        display: inline-block;
        margin: 0 30px;
        font-size: 24px;
        font-weight: bold;
      }

      .team-name {
        color: #333;
        margin-bottom: 5px;
      }

      .score-value {
        font-size: 36px;
        color: #1a472a;
      }

      #controls {
        margin-top: 15px;
        color: white;
        font-size: 14px;
      }

      .control-hint {
        background: rgba(0, 0, 0, 0.3);
        padding: 8px 15px;
        border-radius: 5px;
        display: inline-block;
        margin: 5px;
      }

      .tip {
        margin-top: 10px;
        background: rgba(255, 165, 0, 0.2);
        padding: 10px 20px;
        border-radius: 8px;
        color: #ffa500;
        font-weight: bold;
        border: 2px solid rgba(255, 165, 0, 0.4);
        line-height: 1.6;
      }

      @keyframes glow {
        0%, 100% { box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
        50% { box-shadow: 0 10px 60px rgba(255, 215, 0, 0.4); }
      }

      #gameCanvas {
        animation: glow 3s ease-in-out infinite;
      }

      strong {
        color: #ffd700;
      }
    </style>
  </head>
  <body>
    <div id="gameContainer">
      <canvas id="gameCanvas" width="1000" height="600"></canvas>
      <div id="scoreBoard">
        <div class="score">
          <div class="team-name">🇩🇪 Germany</div>
          <div class="score-value" id="score1">0</div>
        </div>
        <div class="score">
          <div class="team-name">🇧🇷 Brazil</div>
          <div class="score-value" id="score2">0</div>
        </div>
      </div>
      <div id="controls">
        <div style="margin-bottom: 10px;">
          <strong style="color: #ffd700; font-size: 18px;">🎮 CONTROLS</strong>
        </div>
        <div class="control-hint">
          <strong>🇩🇪 Player 1:</strong> WASD - Move | Q - Charge Shot | E - Dash
        </div>
        <div class="control-hint">
          <strong>🇧🇷 Player 2:</strong> Arrow Keys - Move | Shift - Charge Shot | Enter - Dash
        </div>
        <div class="tip">
          💡 <strong>Tips:</strong> Collect power-ups! ⚡Speed 💥Power 🛡️Shield<br>
          Hold charge button for super shots! Dash to move quickly!
        </div>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
